name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Also run here, not only in auto-tag.yml: a tag pushed by hand or a manual
  # dispatch comes straight to this workflow.
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-X main.Version=${{ steps.version.outputs.version }}" \
            -o prflow-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/prflow

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: prflow-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Prepare release assets
        run: |
          mkdir release
          for dir in binaries/*/; do
            name=$(basename "$dir")
            mv "$dir$name" "release/$name"
          done
          chmod +x release/*
          # Self-update refuses a release without this, so don't drop it.
          (cd release && sha256sum prflow-* > SHA256SUMS)

      - name: Create release
        # Pinned to a commit: this step holds contents: write, and a tag can be
        # moved. v1 ran on a Node version Actions no longer supports.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
